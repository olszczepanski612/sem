
name: Java CI with MySQL Integration Tests

on:
  push:
  pull_request:

jobs:
  UnitTests:
    name: Unit Tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run Unit Tests
        run: mvn -B -Dtest=MyTest test

  IntegrationTests:
    name: Integration Tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Start MySQL
        run: docker compose up -d --build db

      - name: Run Integration Tests
        run: mvn -B -Dtest=AppIntegrationTest test
        env:
          DB_HOST: localhost:33060

      - name: Stop MySQL
        if: always()
        run: docker compose down

  DockerBuild:
    name: Docker Build
    runs-on: ubuntu-22.04
    needs: [UnitTests, IntegrationTests]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Package Application
        run: mvn -B package -DskipTests

      - name: Build Docker Images
        run: docker compose build

      - name: Start Application
        run: |
          docker compose up -d db
          docker compose run --rm app

      - name: Stop Containers
        if: always()
        run: docker compose down
